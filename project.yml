name: Framer
options:
  minimumXcodeGenVersion: "2.38"
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  bundleIdPrefix: com.arthursoares

packages:
  FramerCore:
    path: .

targets:
  Framer:
    type: application
    platform: macOS
    sources:
      - path: Sources/FramerApp
      - path: assets/textures
        type: folder
        buildPhase: resources
    dependencies:
      - package: FramerCore
        product: FramerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthursoares.Framer
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        INFOPLIST_KEY_CFBundleDisplayName: "Framer"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
    entitlements:
      path: Sources/FramerApp/Framer.entitlements

schemes:
  Framer:
    build:
      targets:
        Framer: all
    run:
      config: Debug
    archive:
      config: Release
