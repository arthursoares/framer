name: Framer
settings:
  base:
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

options:
  minimumXcodeGenVersion: "2.38"
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  bundleIdPrefix: com.arthursoares

packages:
  FramerCore:
    path: .

targets:
  Framer:
    type: application
    platform: macOS
    sources:
      - path: Sources/FramerApp
      - path: assets/Assets.xcassets
      - path: assets/textures
        type: folder
        buildPhase: resources
      - path: assets/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: FramerCore
        product: FramerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthursoares.Framer
        DEVELOPMENT_TEAM: QLW5M4WG7H
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.photography"
        INFOPLIST_KEY_CFBundleDisplayName: "Framer"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Framer.entitlements
        ENABLE_HARDENED_RUNTIME: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  FramerAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FramerAppTests
    dependencies:
      - target: Framer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthursoares.FramerAppTests
        DEVELOPMENT_TEAM: QLW5M4WG7H
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

  FramerMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/FramerMobile
      - path: assets/Assets.xcassets
      - path: assets/textures
        type: folder
        buildPhase: resources
      - path: assets/fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: FramerCore
        product: FramerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthursoares.FramerMobile
        DEVELOPMENT_TEAM: QLW5M4WG7H
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "2.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: "Framer"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Framer needs access to your photo library to select and process photos."
        INFOPLIST_KEY_UIAppFonts: "[AtkinsonHyperlegibleNext-Regular.ttf, AtkinsonHyperlegibleNext-Medium.ttf, AtkinsonHyperlegibleNext-SemiBold.ttf, AtkinsonHyperlegibleNext-Bold.ttf, SourceCodePro-Regular.ttf, SourceCodePro-Medium.ttf]"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""

  FramerMobileTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FramerMobileTests
    dependencies:
      - target: FramerMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arthursoares.FramerMobileTests
        DEVELOPMENT_TEAM: QLW5M4WG7H
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Framer:
    build:
      targets:
        Framer: all
        FramerAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: FramerAppTests
    archive:
      config: Release

  FramerMobile:
    build:
      targets:
        FramerMobile: all
        FramerMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: FramerMobileTests
    archive:
      config: Release
