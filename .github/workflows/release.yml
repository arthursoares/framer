name: Release artifact

# Builds the CLI and its SwiftPM resource bundle when a version tag is pushed,
# verifies the relocated artifact, and attaches it with SHA-256 checksums to
# the GitHub release for that tag. If no release exists yet it creates a DRAFT
# — publishing is a separate, explicitly authorized step, and notes come from the
# CHANGELOG per .claude/skills/release/SKILL.md (never auto-generated here).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-attach:
    name: build framer (macOS arm64) and attach to release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # No LFS: the CLI resource bundle contains only FramerCore resources
      # from plain git; overlay textures are runtime assets, not build inputs.
      - uses: actions/checkout@v5

      - name: Build, package, and smoke-test release artifact
        run: |
          tools/release/package-cli.sh \
            "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/framer-release-build" \
            "$GITHUB_WORKSPACE/release-artifacts"

      - name: Attach to release (draft if none exists)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="release-artifacts/framer-${GITHUB_REF_NAME}-macos-arm64.tar.gz"
          CHECKSUMS="release-artifacts/SHA256SUMS"
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" "$CHECKSUMS" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" "$CHECKSUMS" --draft \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$NOTES"
          fi
