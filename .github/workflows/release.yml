name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            # First release - get all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            # Get commits since last tag
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi

          # Save changelog to file
          cat > RELEASE_NOTES.md <<EOF
          ## What's Changed

          ${CHANGELOG}

          ## Installation

          ### Homebrew (macOS ARM)
          \`\`\`bash
          brew tap arthursoares/framer
          brew install framer
          \`\`\`

          ### Binary Download
          Download the appropriate binary for your platform below and make it executable:

          **macOS ARM64:**
          \`\`\`bash
          curl -L -o framer https://github.com/arthursoares/framer/releases/download/v${{ steps.get_version.outputs.version }}/framer-darwin-arm64
          chmod +x framer
          sudo mv framer /usr/local/bin/
          \`\`\`

          **Linux AMD64:**
          \`\`\`bash
          curl -L -o framer https://github.com/arthursoares/framer/releases/download/v${{ steps.get_version.outputs.version }}/framer-linux-amd64
          chmod +x framer
          sudo mv framer /usr/local/bin/
          \`\`\`

          **Linux ARM64:**
          \`\`\`bash
          curl -L -o framer https://github.com/arthursoares/framer/releases/download/v${{ steps.get_version.outputs.version }}/framer-linux-arm64
          chmod +x framer
          sudo mv framer /usr/local/bin/
          \`\`\`

          **Windows AMD64:**
          Download \`framer-windows-amd64.exe\` and add it to your PATH.

          ## Full Documentation

          See the [README](https://github.com/arthursoares/framer#readme) for complete usage instructions.
          EOF

          cat RELEASE_NOTES.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release v${{ steps.get_version.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}

  build-and-upload:
    name: Build and Upload
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            output: framer-darwin-arm64
          - goos: linux
            goarch: amd64
            output: framer-linux-amd64
          - goos: linux
            goarch: arm64
            output: framer-linux-arm64
          - goos: windows
            goarch: amd64
            output: framer-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w -X main.version=${{ needs.create-release.outputs.version }}" -o ${{ matrix.output }} framer.go fonts.go

      - name: Calculate SHA256
        id: sha256
        run: |
          sha256sum ${{ matrix.output }} > ${{ matrix.output }}.sha256
          echo "sha256=$(cat ${{ matrix.output }}.sha256 | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ matrix.output }}
          asset_name: ${{ matrix.output }}
          asset_content_type: application/octet-stream

      - name: Upload SHA256
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ matrix.output }}.sha256
          asset_name: ${{ matrix.output }}.sha256
          asset_content_type: text/plain

      - name: Save macOS binary info for Homebrew
        if: matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        run: |
          echo "SHA256: ${{ steps.sha256.outputs.sha256 }}" > homebrew-info.txt
          echo "Version: ${{ needs.create-release.outputs.version }}" >> homebrew-info.txt
          echo "URL: https://github.com/arthursoares/framer/releases/download/v${{ needs.create-release.outputs.version }}/${{ matrix.output }}" >> homebrew-info.txt

      - name: Upload Homebrew info
        if: matrix.goos == 'darwin' && matrix.goarch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-info
          path: homebrew-info.txt
          retention-days: 90

  notify-success:
    name: Notify Success
    needs: [create-release, build-and-upload]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Success message
        run: |
          echo "✅ Release v${{ needs.create-release.outputs.version }} completed successfully!"
          echo "📦 Binaries uploaded for all platforms"
          echo "🔗 https://github.com/arthursoares/framer/releases/tag/v${{ needs.create-release.outputs.version }}"
