name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift build + test (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # LFS stays OFF: assets/textures/ is ~355 MB across 168 LFS objects and
      # no tier-1 test reads it (the ASCII LUT atlases EffectGPUGoldenTests
      # needs are plain-git PNGs under Sources/FramerCore/Resources/textures/).
      # Fetching LFS here would drain the bandwidth quota on every run.
      - uses: actions/checkout@v5

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build

      # EffectGPUGoldenTests throws XCTSkip when the runner exposes no Metal
      # device; a nonzero skip count in the log is expected on such hosts,
      # not a green light to ignore skips locally (the dev-Mac gate expects 0).
      - name: Test (tier 1)
        run: swift test

  native-apps:
    name: macOS and iOS app checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      # These checks compile the native apps and run focused interaction tests.
      # They do not render texture fixtures, so LFS remains disabled.
      - uses: actions/checkout@v5

      - name: Test macOS app interactions
        run: |
          xcodebuild test \
            -project Framer.xcodeproj -scheme Framer \
            -destination 'platform=macOS' \
            -only-testing:FramerAppTests/DesktopInteractionUXTests/test_arrowNavigationUsesFocusedPhotoAndStopsAtFilmstripEnds \
            -only-testing:FramerAppTests/DesktopInteractionUXTests/test_clearFinishedExportsRetainsOnlyActiveJobs \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS app for Simulator
        run: |
          xcodebuild build \
            -project Framer.xcodeproj -scheme FramerMobile \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test iOS app interactions
        run: |
          simulator_id="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.isAvailable and (.name | startswith("iPhone")))] | first | .udid // empty')"
          if [ -z "$simulator_id" ]; then
            echo 'No available iPhone Simulator' >&2
            exit 1
          fi
          xcodebuild test \
            -project Framer.xcodeproj -scheme FramerMobile \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:FramerMobileTests/MobileControlsUXTests \
            CODE_SIGNING_ALLOWED=NO
